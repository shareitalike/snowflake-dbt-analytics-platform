# ==============================================================================
# FILE: airflow_connections.yaml
# PHASE: 12 - Platform Engineering
# 
# EXPLANATION: Defines the Airflow connections for Snowflake, dbt Cloud, and Slack using a YAML configuration mapped to AWS Secrets Manager.
# DESIGN DECISIONS: Passwords and API tokens are explicitly NOT stored in this file. Instead, the SecretsManagerBackend fetches the actual credentials securely at runtime.
# WHY: Storing credentials in plain text in a Git repository is a critical security violation. Using AWS Secrets Manager ensures credentials are encrypted at rest and can be rotated without modifying the codebase.
# ==============================================================================

connections:
  snowflake_default:
    conn_type: snowflake
    description: "Enterprise Snowflake Connection managed by AWS Secrets Manager"
    host: "omniretail.snowflakecomputing.com"
    login: "AIRFLOW_SVC"
    # Password is NOT stored here. Airflow uses the SecretsManagerBackend to fetch it at runtime.
    # secret_id: "prod/snowflake_airflow_svc_password"
    extra:
      account: "omniretail"
      warehouse: "PROD_DATA_ENG_WH"
      database: "PROD_METADATA_DB"
      role: "PROD_DATA_ENGINEER_ROLE"
      # For Key-Pair authentication:
      # private_key_file: "/var/secrets/snowflake_rsa_key.p8"

  dbt_cloud_default:
    conn_type: dbt_cloud
    description: "dbt Cloud API Token"
    login: "omniretail_tenant_id"
    # Password (API Token) fetched from AWS Secrets Manager at runtime.

  slack_api_default:
    conn_type: http
    description: "Slack Webhook for Enterprise Alert Router"
    host: "https://hooks.slack.com/services/"
    # Password (Token) fetched from AWS Secrets Manager at runtime.
